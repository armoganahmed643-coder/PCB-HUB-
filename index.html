<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags for Mobile and SEO -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB HUB - Initialization</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css">

<body class="splash-body">
    <!-- Global Loader (Hidden by Default) -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Splash Screen Container -->
    <main class="splash-container">
        <div class="logo-wrapper pulse-animation">
            <i class="fa-solid fa-microchip logo-icon"></i>
            <h1 class="logo-text">PCB <span>HUB</span></h1>
            <p class="tagline">System Initializing...</p>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Core Script -->
    <script src="script.js"></script>
</body>
</html>
