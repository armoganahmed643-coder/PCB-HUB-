<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB HUB - Request Access</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <!-- Global Loader -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Main Registration Container -->
    <main class="auth-wrapper">
        <div class="glass-card auth-card slide-up-animation">
            <div class="auth-header">
                <i class="fa-solid fa-user-shield auth-icon"></i>
                <h2>Request Access</h2>
                <p>Register for a PCB HUB clearance</p>
            </div>

            <!-- Registration Form -->
            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="fullname" required placeholder=" ">
                    <label for="fullname">Full Name</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="reg-email" required placeholder=" ">
                    <label for="reg-email">Email Address</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="reg-password" required placeholder=" ">
                    <label for="reg-password">Password</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-shield-check input-icon"></i>
                    <input type="password" id="confirm-password" required placeholder=" ">
                    <label for="confirm-password">Confirm Password</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Initialize Profile</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have clearance? <a href="login.html" class="accent-link">Access System</a></p>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
