<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB HUB - Security Override</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <!-- Global Loader -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Password Reset Container -->
    <main class="auth-wrapper">
        <div class="glass-card auth-card slide-up-animation">
            <div class="auth-header">
                <i class="fa-solid fa-fingerprint auth-icon"></i>
                <h2>Security Override</h2>
                <p>Initiate password reset protocol</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgot-password-form" class="auth-form">
                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="reset-email" required placeholder=" ">
                    <label for="reset-email">Registered Email Address</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Send Override Link</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="login.html" class="accent-link"><i class="fa-solid fa-arrow-left"></i> Return to Gateway</a></p>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <script src="script.js"></script>
</body>
</html>
